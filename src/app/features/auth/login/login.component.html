<div class="flex items-center justify-center bg-[#FFFDF5] px-4 py-12 sm:py-16">
  <div class="w-full max-w-md bg-[#FFF9E6] border-2 border-[#2C221E]/15 p-8 sm:p-10 rounded-[2rem] space-y-6">

    <!-- Encabezado -->
    <div class="text-center space-y-3">
      <span
        class="mx-auto w-16 h-16 grid place-items-center bg-[#E85A4F] text-white font-black text-3xl rounded-2xl border-[3px] border-[#2C221E] shadow-[3px_3px_0px_0px_rgba(44,34,30,1)]"
      >
        Y
      </span>
      <h1 class="text-3xl font-black tracking-tight text-[#2C221E]">Iniciar Sesión</h1>
      <p class="text-sm font-bold text-[#5C5046]">
        Ingresa a tu cuenta de <span class="text-[#E85A4F]">Proyecto Yuca</span>
      </p>
    </div>

    <!-- Mensaje de error -->
    <div
      *ngIf="errorMessage"
      class="p-4 bg-[#E85A4F]/20 border-2 border-[#E85A4F] rounded-2xl text-[#8B1E14] text-sm font-black flex items-center gap-2"
    >
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-5">
      <div>
        <label for="email" class="block text-xs font-black text-[#5C5046] uppercase tracking-wide mb-2">
          Usuario
        </label>
        <input
          id="email"
          type="text"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="email"
          placeholder="yuquita"
          class="w-full bg-white border-2 border-[#F4C453] rounded-2xl px-5 py-3.5 text-[#2C221E] placeholder-[#5C5046]/40 focus:outline-none focus:border-[#E85A4F] transition text-base"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-black text-[#5C5046] uppercase tracking-wide mb-2">
          Contraseña
        </label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
          class="w-full bg-white border-2 border-[#F4C453] rounded-2xl px-5 py-3.5 text-[#2C221E] placeholder-[#5C5046]/40 focus:outline-none focus:border-[#E85A4F] transition text-base"
        />
      </div>

      <button
        type="submit"
        class="w-full inline-flex items-center justify-center gap-2 bg-[#E85A4F] hover:bg-[#d4473c] text-white font-black py-4 px-6 rounded-2xl border-2 border-[#2C221E] shadow-[4px_4px_0px_0px_rgba(44,34,30,1)] transition hover:-translate-y-0.5 cursor-pointer text-sm tracking-wide"
      >
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Ingresar</span>
      </button>
    </form>

    <p class="text-center text-xs font-bold text-[#5C5046]">
      ¿Eres un artista o emprendedor nuevo?
      <a routerLink="/registro-artista" class="font-black text-[#E85A4F] underline underline-offset-2 hover:text-[#d4473c]">
        Regístrate aquí
      </a>
    </p>

  </div>
</div>
